<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Release Notifier - API Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.3em;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95em;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .response {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 6px;
      border-left: 4px solid #667eea;
      max-height: 300px;
      overflow-y: auto;
    }

    .response pre {
      margin: 0;
      color: #333;
      font-size: 0.85em;
      line-height: 1.4;
    }

    .status-success {
      border-left-color: #4caf50;
      background: #f1f8f4;
    }

    .status-error {
      border-left-color: #f44336;
      background: #fef5f5;
    }

    .status-info {
      border-left-color: #2196f3;
      background: #f1f7ff;
    }

    .health-check {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
    }

    .health-check h2 {
      color: white;
      border-bottom-color: rgba(255, 255, 255, 0.3);
    }

    .health-status {
      font-size: 3em;
      margin: 20px 0;
    }

    .health-status.ok {
      color: #4caf50;
    }

    .health-timestamp {
      opacity: 0.9;
      font-size: 0.9em;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-text {
      color: #f44336;
      font-size: 0.85em;
      margin-top: 5px;
    }

    .success-text {
      color: #4caf50;
      font-size: 0.85em;
      margin-top: 5px;
    }

    .info-text {
      color: #2196f3;
      font-size: 0.85em;
      margin-top: 10px;
      padding: 10px;
      background: #f1f7ff;
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Release Notifier</h1>
      <p>API Client для управління підписками на релізи</p>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Підписатися</h2>
        <div class="form-group">
          <label for="subscribe-email">Email:</label>
          <input type="email" id="subscribe-email" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="subscribe-repo">Репозиторій:</label>
          <input type="text" id="subscribe-repo" placeholder="owner/repo (e.g., golang/go)">
          <div class="info-text">Формат: owner/repo</div>
        </div>
        <button class="btn" onclick="subscribe()">Підписатися</button>
        <div id="subscribe-response"></div>
      </div>

      <div class="card">
        <h2>Підтвердити</h2>
        <div class="form-group">
          <label for="confirm-token">Токен підтвердження:</label>
          <input type="text" id="confirm-token" placeholder="Токен з email">
          <div class="info-text">Отримаєте у confirmation email після підписки</div>
        </div>
        <button class="btn" onclick="confirm()">Підтвердити підписку</button>
        <div id="confirm-response"></div>
      </div>

      <div class="card">
        <h2>Відписатися</h2>
        <div class="form-group">
          <label for="unsubscribe-token">Токен відписки:</label>
          <input type="text" id="unsubscribe-token" placeholder="Токен з email">
          <div class="info-text">Клацніть посилання з email для відписки</div>
        </div>
        <button class="btn" onclick="unsubscribe()">Відписатися</button>
        <div id="unsubscribe-response"></div>
      </div>

      <div class="card">
        <h2>Мої підписки</h2>
        <div class="form-group">
          <label for="subscriptions-email">Email:</label>
          <input type="email" id="subscriptions-email" placeholder="your@email.com">
        </div>
        <button class="btn" onclick="getSubscriptions()">Отримати підписки</button>
        <div id="subscriptions-response"></div>
      </div>

      <div class="card health-check">
        <h2>Статус сервісу</h2>
        <div class="health-status" id="health-status">?</div>
        <div class="health-timestamp" id="health-timestamp"></div>
        <button class="btn" onclick="checkHealth()" style="background: rgba(255, 255, 255, 0.2); margin-top: 20px;">Перевірити</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;

    function showResponse(elementId, data, isError = false) {
      const element = document.getElementById(elementId);
      const status = isError ? 'status-error' : 'status-success';
      element.innerHTML = `<div class="response ${status}"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
    }

    function showError(elementId, error) {
      showResponse(elementId, error, true);
    }

    async function subscribe() {
      const email = document.getElementById('subscribe-email').value;
      const repo = document.getElementById('subscribe-repo').value;

      if (!email || !repo) {
        showError('subscribe-response', { error: 'Заповніть обидва поля' });
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, repo })
        });

        const data = await response.json();
        if (response.ok) {
          showResponse('subscribe-response', data);
          document.getElementById('subscribe-email').value = '';
          document.getElementById('subscribe-repo').value = '';
        } else {
          showError('subscribe-response', data);
        }
      } catch (error) {
        showError('subscribe-response', { error: error.message });
      }
    }

    async function confirm() {
      const token = document.getElementById('confirm-token').value;

      if (!token) {
        showError('confirm-response', { error: 'Введіть токен' });
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/confirm/${token}`);
        const data = await response.json();
        if (response.ok) {
          showResponse('confirm-response', data);
          document.getElementById('confirm-token').value = '';
        } else {
          showError('confirm-response', data);
        }
      } catch (error) {
        showError('confirm-response', { error: error.message });
      }
    }

    async function unsubscribe() {
      const token = document.getElementById('unsubscribe-token').value;

      if (!token) {
        showError('unsubscribe-response', { error: 'Введіть токен' });
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/unsubscribe/${token}`);
        const data = await response.json();
        if (response.ok) {
          showResponse('unsubscribe-response', data);
          document.getElementById('unsubscribe-token').value = '';
        } else {
          showError('unsubscribe-response', data);
        }
      } catch (error) {
        showError('unsubscribe-response', { error: error.message });
      }
    }

    async function getSubscriptions() {
      const email = document.getElementById('subscriptions-email').value;

      if (!email) {
        showError('subscriptions-response', { error: 'Введіть email' });
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/subscriptions?email=${encodeURIComponent(email)}`);
        const data = await response.json();
        if (response.ok) {
          showResponse('subscriptions-response', data);
        } else {
          showError('subscriptions-response', data);
        }
      } catch (error) {
        showError('subscriptions-response', { error: error.message });
      }
    }

    async function checkHealth() {
      try {
        const response = await fetch(`${API_URL}/health`);
        const data = await response.json();

        if (response.ok) {
          document.getElementById('health-status').textContent = 'Ok';
          document.getElementById('health-status').className = 'health-status ok';
          document.getElementById('health-timestamp').textContent = `Час: ${new Date(data.timestamp).toLocaleString('uk-UA')}`;
        } else {
          document.getElementById('health-status').textContent = 'Error';
          document.getElementById('health-status').className = 'health-status error';
        }
      } catch (error) {
        document.getElementById('health-status').textContent = 'Offline';
        document.getElementById('health-timestamp').textContent = error.message;
      }
    }

    window.addEventListener('load', checkHealth);
    setInterval(checkHealth, 60000);
  </script>
</body>
</html>
