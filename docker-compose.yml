version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: release-notifier-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: release_notifier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: release-notifier-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: release-notifier-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/release_notifier
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      SCANNER_INTERVAL: 3600000
      EMAIL_HOST: ${EMAIL_HOST:-smtp.mailtrap.io}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@release-notifier.local}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - release-notifier-network

networks:
  release-notifier-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
